server:
  port: 8080

spring:
  data:
    mongodb:
      uri: ${MONGO_URI:mongodb://localhost:27017/gazfacile}
  application:
    name: gazfacile-backend

jwt:
  secret: ${JWT_SECRET:gazfacile-super-secret-key-must-be-at-least-256-bits-long-for-hs256-algorithm}
  expiration: 86400000
  refresh-expiration: 604800000

cors:
  allowed-origins:
    - http://localhost:4200
    - https://gazfacile.netlify.app

paiement:
  # MTN Mobile Money
  mtn:
    base-url: ${MTN_MOMO_BASE_URL:https://sandbox.momodeveloper.mtn.com}
    subscription-key: ${MTN_MOMO_SUBSCRIPTION_KEY:votre-cle-mtn}
    api-user: ${MTN_MOMO_API_USER:votre-api-user-mtn}
    api-key: ${MTN_MOMO_API_KEY:votre-api-key-mtn}
    environment: ${MTN_MOMO_ENV:sandbox}

  # Moov Money (Flooz) — Moov Africa Bénin
  moov:
    base-url: ${MOOV_BASE_URL:https://api.moov-africa.bj}
    api-key: ${MOOV_API_KEY:votre-api-key-moov}
    api-secret: ${MOOV_API_SECRET:votre-secret-moov}
    merchant-id: ${MOOV_MERCHANT_ID:votre-merchant-id}

  # Celtiis Cash — Celtiis Bénin
  celtiis:
    base-url: ${CELTIIS_BASE_URL:https://api.celtiis.bj}
    api-key: ${CELTIIS_API_KEY:votre-api-key-celtiis}
    api-secret: ${CELTIIS_API_SECRET:votre-secret-celtiis}
    merchant-code: ${CELTIIS_MERCHANT_CODE:votre-code-marchand}

logging:
  level:
    bj.gazfacile: DEBUG
    org.springframework.data.mongodb: INFO